[project]
name = "analyticsmeta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.2",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "cryptography>=46.0.5",
    "daphne>=4.2.1",
    "django>=6.0.2",
    "django-allauth>=65.14.3",
    "django-debug-toolbar>=6.2.0",
    "django-extensions>=4.1",
    "django-ratelimit>=4.1.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.28.0",
    "ipython>=9.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.2",
    "pyjwt>=2.11.0",
    "python-decouple>=3.8",
    "python-json-logger>=4.0.0",
    "redis>=5.2.0,<8.0",
    "requests>=2.32.5",
    "structlog>=25.5.0",
    "whitenoise>=6.11.0",
    "xlrd>=2.0.2",
]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["apps"]
omit = [
    # Auto-generated Django migrations — not business logic
    "*/migrations/*",
    # Management commands — tested via CLI invocation, not pytest
    "*/management/commands/*",
    # WebSocket consumers — require channels test client & live layer
    "apps/insights/consumers.py",
    "apps/insights/routing.py",
    "apps/insights/generators/*",
    "apps/insights/utils.py",
    # Heavy rendering pipelines — require PDF/chart libraries & fixtures
    "apps/reports/charts.py",
    "apps/reports/generators.py",
    # Debug/dev-only utility
    "apps/dashboards/debug.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "black>=26.3.1",
    "django-extensions>=4.1",
    "factory-boy>=3.3.3",
    "flake8>=7.3.0",
    "ipython>=9.11.0",
    "psutil>=7.2.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
