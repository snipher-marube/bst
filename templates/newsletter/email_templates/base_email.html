<!-- newsletter/templates/newsletter/email_templates/base_email.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block subject %}{% endblock %}</title>
    <style>
        /* Email-safe styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #03466e 0%, #022b44 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
        }
        .content {
            background: #ffffff;
            padding: 40px 20px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #f68712;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
        }
        .footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        .social-links {
            margin: 20px 0;
        }
        .social-links a {
            display: inline-block;
            margin: 0 10px;
            color: #03466e;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block header_title %}{{ site_name }}{% endblock %}</h1>
        </div>
        
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        
        <div class="footer">
            <div class="social-links">
                <a href="{{ social_links.twitter }}">Twitter</a>
                <a href="{{ social_links.linkedin }}">LinkedIn</a>
                <a href="{{ social_links.github }}">GitHub</a>
            </div>
            <p>
                &copy; {% now "Y" %} {{ site_name }}. All rights reserved.<br>
                You're receiving this because you subscribed to our newsletter.<br>
                <a href="{% block unsubscribe_link %}{{ unsubscribe_url }}{% endblock %}">Unsubscribe</a>
            </p>
        </div>
    </div>
</body>
</html>
