services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Web Service  (Daphne ASGI — handles HTTP + WebSockets via Django Channels)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: analyticsmeta
    runtime: python
    region: oregon
    plan: free

    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput --settings=config.settings.production

    preDeployCommand: python manage.py migrate --settings=config.settings.production

    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application

    healthCheckPath: /

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: analyticsmeta.onrender.com

      - key: SITE_URL
        value: https://analyticsmeta.onrender.com

      # ── Postgres ──────────────────────────────────────────────────────────
      - key: PG_DATABASE_NAME
        sync: false

      - key: PG_DATABASE_USER
        sync: false

      - key: PG_DATABASE_PASSWORD
        sync: false

      - key: PG_DATABASE_HOST
        sync: false

      - key: PG_DATABASE_PORT
        value: "5432"

      # ── Redis (Upstash) ───────────────────────────────────────────────────
      - key: REDIS_URL
        sync: false

      - key: REDIS_HOST
        sync: false

      - key: REDIS_PORT
        sync: false

      # ── Email ─────────────────────────────────────────────────────────────
      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      # ── Google OAuth ──────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ── LinkedIn OAuth ────────────────────────────────────────────────────
      - key: LINKEDIN_CLIENT_ID
        sync: false

      - key: LINKEDIN_CLIENT_SECRET
        sync: false

      # ── Stripe ────────────────────────────────────────────────────────────
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ── M-Pesa Daraja ─────────────────────────────────────────────────────
      - key: MPESA_CONSUMER_KEY
        sync: false

      - key: MPESA_CONSUMER_SECRET
        sync: false

      - key: MPESA_SHORTCODE
        sync: false

      - key: MPESA_PASSKEY
        sync: false

      - key: MPESA_CALLBACK_URL
        sync: false

      # ── Optional ──────────────────────────────────────────────────────────
      - key: SUPPORT_EMAIL
        value: support@analyticsmeta.com

      - key: SALES_EMAIL
        value: sales@analyticsmeta.com

      - key: SITE_NAME
        value: AnalyticsMeta

