name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: analyticsmeta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/analyticsmeta_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: dummy-secret
      EMAIL_HOST_USER: ci.test@ci.com
      EMAIL_HOST_PASSWORD: dummy_password
      SUPPORT_EMAIL: support@test.com
      SALES_EMAIL: sales@test.com
      MPESA_CONSUMER_KEY: dummy-mpessa-consumer-key
      MPESA_CONSUMER_SECRET: dummy-consumer-secret
      MPESA_SHORTCODE: "600000"
      MPESA_PASSKEY: test-passkey
      MPESA_CALLBACK_URL: http://localhost:8000/subscriptions/mpesa/callback/
      GOOGLE_CLIENT_ID: dummy-google-client-id-for-ci
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret-for-ci
      LINKEDIN_CLIENT_ID: dummy-linkedin-client-is-for-ci
      LINKEDIN_CLIENT_SECRET: dummy-linkedin-client-secret-for-ci
      # Add back PG_DATABASE variables with test database name
      PG_DATABASE_NAME_DEV: analyticsmeta_test
      PG_DATABASE_USER_DEV: postgres
      PG_DATABASE_HOST_DEV: localhost
      PG_DATABASE_PORT_DEV: 5432
      PG_DATABASE_PASSWORD_DEV: postgres

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-fail-under=70 -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage