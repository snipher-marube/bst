{% load i18n %}
<div id="cookie-consent"
     class="fixed bottom-0 left-0 right-0 z-50 bg-gray-900 text-white px-4 py-4 transform transition-transform duration-300 translate-y-full"
     role="region" aria-label="Cookie consent">
    <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 max-w-5xl">
        <p class="text-sm text-gray-300 text-center sm:text-left">
            We use cookies to enhance your experience. See our
            <a href="{% url 'core:privacy' %}" class="text-[#f68712] hover:text-white underline transition-colors">Privacy Policy</a>
            for details.
        </p>
        <div class="flex gap-3 flex-shrink-0">
            <button id="cookie-accept"
                    class="px-5 py-2 bg-[#f68712] text-white text-sm font-semibold rounded-lg hover:bg-[#e07810] focus:outline-none focus:ring-2 focus:ring-[#f68712] focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors">
                Accept
            </button>
            <button id="cookie-decline"
                    class="px-5 py-2 bg-gray-700 text-white text-sm font-medium rounded-lg hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors">
                Decline
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    var banner = document.getElementById('cookie-consent');
    var accept = document.getElementById('cookie-accept');
    var decline = document.getElementById('cookie-decline');
    if (!banner) return;

    function hide() { banner.classList.add('translate-y-full'); }

    if (!localStorage.getItem('cookieConsent')) {
        setTimeout(function () { banner.classList.remove('translate-y-full'); }, 800);
    }

    accept && accept.addEventListener('click', function () {
        localStorage.setItem('cookieConsent', 'accepted');
        hide();
        if (typeof gtag !== 'undefined') gtag('consent', 'update', { analytics_storage: 'granted' });
    });

    decline && decline.addEventListener('click', function () {
        localStorage.setItem('cookieConsent', 'declined');
        hide();
        if (typeof gtag !== 'undefined') gtag('consent', 'update', { analytics_storage: 'denied' });
    });
})();
</script>
