version: 2

updates:
  # ── Python dependencies (requirements.txt) ──────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Nairobi
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - Snipher-Marube
    ignore:
      # Pin Django major version — upgrade manually
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # Pin Celery major version
      - dependency-name: "celery"
        update-types: ["version-update:semver-major"]
      # Pin DRF major version
      - dependency-name: "djangorestframework"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions (if you add workflows later) ──────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Nairobi
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - Snipher-Marube
