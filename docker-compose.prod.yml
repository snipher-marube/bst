# ══════════════════════════════════════════════════════════════════════════════
# docker-compose.prod.yml — production stack for AnalyticsMeta
#
# Usage (VPS / self-hosted):
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# On Render.com the web/worker services are deployed via render.yaml.
# This file is for self-hosted / VPS deployments.
# ══════════════════════════════════════════════════════════════════════════════

x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  SITE_URL: ${SITE_URL}
  # Postgres
  PG_DATABASE_NAME: ${PG_DATABASE_NAME}
  PG_DATABASE_USER: ${PG_DATABASE_USER}
  PG_DATABASE_PASSWORD: ${PG_DATABASE_PASSWORD}
  PG_DATABASE_HOST: postgres
  PG_DATABASE_PORT: "5432"
  # Redis
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Email
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  # OAuth
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
  # Stripe
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  # M-Pesa
  MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
  MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
  MPESA_SHORTCODE: ${MPESA_SHORTCODE}
  MPESA_PASSKEY: ${MPESA_PASSKEY}
  MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile.prod
  restart: unless-stopped
  networks:
    - analytics_network

services:

  # ── Nginx — TLS termination & reverse proxy ───────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro          # place fullchain.pem + privkey.pem here
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ── Web — Daphne ASGI (HTTP + WebSocket) ─────────────────────────────────
  web:
    <<: *app-build
    environment:
      <<: *common-env
      COLLECT_STATIC: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/static/media
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ── Celery worker — background tasks ─────────────────────────────────────
  celery-worker:
    <<: *app-build
    command: celery -A config worker --loglevel=info --concurrency=2 --max-tasks-per-child=500
    environment:
      <<: *common-env
      COLLECT_STATIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--destination", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ── Celery beat — scheduler (MUST stay at exactly 1 replica) ─────────────
  celery-beat:
    <<: *app-build
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *common-env
      COLLECT_STATIC: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    deploy:
      replicas: 1     # NEVER increase — duplicate beat causes duplicate tasks
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c log_min_duration_statement=500
        -c log_checkpoints=on
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  app_logs:
  nginx_logs:
  certbot_www:

networks:
  analytics_network:
    driver: bridge
