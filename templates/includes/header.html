{% load static %}
<!-- Header/Navbar -->
<header class="sticky top-0 z-50 w-full bg-white/95 backdrop-blur-sm border-b border-gray-100 shadow-sm">
    <nav class="container mx-auto px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
        <div class="flex items-center justify-between h-16 md:h-20">
            <!-- Logo -->
            <div class="flex-shrink-0">
                <a href="{% url 'core:home' %}" class="flex items-center space-x-2" aria-label="Business SIght Technologies Home">
                    <img src="{% static 'images/logo.png' %}" alt="Business SIght Technologies Logo" class="h-12 w-auto md:h-14">
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex md:items-center md:space-x-8">
                {% for item in main_nav %}
                <a href="{{ item.url }}" 
                   class="text-sm font-medium transition-colors duration-200 {% if item.active %}text-blue-600{% else %}text-gray-700 hover:text-blue-600{% endif %}"
                   {% if item.active %}aria-current="page"{% endif %}>
                    {{ item.title }}
                </a>
                {% endfor %}
            </div>
            
            <!-- Desktop Right Navigation -->
            <div class="hidden md:flex md:items-center md:space-x-4">
                {% if user.is_authenticated %}
                    <a href="#" class="text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors duration-200">
                        Dashboard
                    </a>
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" class="flex items-center space-x-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors duration-200 focus:outline-none" aria-expanded="false" :aria-expanded="open.toString()">
                            <span>{{ user.email|truncatechars:20 }}</span>
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <div x-show="open" @click.away="open = false" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="transform opacity-0 scale-95" x-transition:enter-end="transform opacity-100 scale-100" x-transition:leave="transition ease-in duration-75" x-transition:leave-start="transform opacity-100 scale-100" x-transition:leave-end="transform opacity-0 scale-95" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 border border-gray-100" style="display: none;">
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Profile</a>
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Settings</a>
                            <div class="border-t border-gray-100 my-1"></div>
                            <a href="{% url 'account_logout' %}" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-50">Sign out</a>
                        </div>
                    </div>
                {% else %}
                    <a href="{% url 'account_login' %}" class="text-sm font-medium text-gray-700 hover:text-blue-600 transition-colors duration-200">
                        Sign in
                    </a>
                    <a href="{% url 'account_signup' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 shadow-sm hover:shadow-md">
                        Start Free Trial
                    </a>
                {% endif %}
            </div>
            
            <!-- Mobile menu button -->
            <div class="flex md:hidden">
                <button type="button" 
                        class="mobile-menu-button inline-flex items-center justify-center p-2 rounded-lg text-gray-700 hover:text-blue-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                        aria-expanded="false"
                        aria-label="Toggle navigation menu">
                    <span class="sr-only">Open main menu</span>
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>
</header>
