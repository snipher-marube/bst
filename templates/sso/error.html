{% extends 'base.html' %}
{% block title %}{{ title }} — AnalyticsMeta{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
    <div class="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-5">
      <i class="fas fa-shield-alt text-red-500 text-2xl"></i>
    </div>
    <h1 class="text-xl font-bold text-gray-800 mb-2">{{ title }}</h1>
    <p class="text-sm text-gray-500 mb-6">{{ message }}</p>
    {% if login_url %}
    <a href="{{ login_url }}"
       class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-white text-sm font-semibold hover:opacity-90 transition"
       style="background:#03466e">
      <i class="fas fa-redo"></i> Try Again
    </a>
    {% endif %}
    <p class="text-xs text-gray-400 mt-5">
      Need help? Contact your workspace administrator.
    </p>
  </div>
</div>
{% endblock %}
