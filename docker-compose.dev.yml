name: analyticsmeta-dev

x-app-env: &app-env
  env_file:
    - .env

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: analyticsmeta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DEV_POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network
    mem_limit: 512m
    cpus: '0.5'
    command: postgres -c shared_buffers=128MB -c effective_cache_size=256MB -c work_mem=4MB

  redis:
    image: redis:7-alpine
    ports:
      - "${DEV_REDIS_PORT:-16380}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - analytics_network
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: '0.5'

  web:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app:cached
    ports:
      - "${DEV_WEB_PORT:-18000}:8000"
    environment:
      DEBUG: "1"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analyticsmeta
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      PG_DATABASE_NAME_DEV: analyticsmeta
      PG_DATABASE_USER_DEV: postgres
      PG_DATABASE_PASSWORD_DEV: postgres
      PG_DATABASE_HOST_DEV: postgres
      PG_DATABASE_PORT_DEV: "5432"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@analyticsmeta.com}
      SALES_EMAIL: ${SALES_EMAIL:-sales@analyticsmeta.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/readiness/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    cpus: '0.5'

  celery-worker:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: celery -A config worker -l info --concurrency=1 --max-tasks-per-child=1000
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analyticsmeta
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      PG_DATABASE_NAME_DEV: analyticsmeta
      PG_DATABASE_USER_DEV: postgres
      PG_DATABASE_PASSWORD_DEV: postgres
      PG_DATABASE_HOST_DEV: postgres
      PG_DATABASE_PORT_DEV: "5432"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: '0.5'

  celery-beat:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: celery -A config beat -l info
    volumes:
      - .:/app:cached
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analyticsmeta
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - analytics_network
    healthcheck:
      disable: true
    mem_limit: 256m
    cpus: '0.5'

volumes:
  postgres_data:
  redis_data:

networks:
  analytics_network:
    driver: bridge
